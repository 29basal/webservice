spring.application.name=ApiKullanimi

server.port=8088

# MySQL Veritabanı Yapılandırması (XAMPP / phpMyAdmin)
spring.datasource.url=jdbc:mysql://localhost:3306/app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Yapılandırması
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
